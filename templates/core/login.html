{% extends 'base.html' %}
{% block title %}Login - LaptopERP Enterprise{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white py-3 text-center">
                <h4 class="mb-0"><i class="bi bi-laptop me-2"></i> Enterprise Portal</h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">Username</label>
                        {{ form.username }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Password</label>
                        {{ form.password }}
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In to ERP</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
